description: |
  Open-weight comparability judges for the EACL 2027 revision (a100_80g).

  Every judge in the submitted version is a proprietary checkpoint reached over
  a vendor API, which weakens two claims: the between-reviewer variance sigma_r
  is estimated from six judges, so its interval spans a factor of four and
  cannot carry a design recommendation, and the OpenAI cells are served over a
  different transport from the rest, so the panel is not a single harness.

  Ten instruction-tuned open-weight checkpoints from six developers, spanning
  roughly 8B to 72B, answer three tasks under greedy decoding in one identical
  harness: the constructed comparability benchmark (whose reference verdict is
  fixed before any judge sees the item, so sigma_r gets a reference that is not
  a majority of the judges being measured), the majority-eligible census windows
  under the deployed codebook, and the same windows under the four-verdict
  abstention codebook.

  Prompts are pre-rendered on the machine holding the full-text corpus and
  shipped as a pack, so an open judge answers byte-identical prompts to the API
  judges and every record carries the prompt SHA-256 that proves it.

  amlt 10 accepts one SKU per job, so the requested priority order
  (40G A100, 80G A100, H100, H200) is expressed as four sibling configs; this
  one is a100_80g.

target:
  service: singularity
  name: msrresrchbasicvc
  workspace_name: <AML_WORKSPACE>   # set to your AzureML workspace

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04

code:
  local_dir: $CONFIG_DIR/../manuscript
  ignore:
    - "*"
    - "!scripts/"
    - "scripts/*"
    - "!scripts/revision3/"
    - "scripts/revision3/*"
    - "!scripts/revision3/run_open_weight_judges.py"
    - "!supplement/"
    - "supplement/*"
    - "!supplement/open_judge_prompts/"

env_defaults:
  HF_HOME: /scratch/hf_cache
  HUGGINGFACE_HUB_CACHE: /scratch/hf_cache/hub
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

jobs:

  - name: owj-qwen3-8b
    identity: managed
    sku: 80G1-A100
    sla_tier: standard
    process_count_per_node: 1
    command:
      - |
        set -uo pipefail
        OUT="$$AMLT_OUTPUT_DIR/qwen3-8b"
        mkdir -p "$$OUT"
        exec > "$$OUT/run.log" 2>&1
        export PYTHONUSERBASE=/scratch/python_userbase
        export PATH="$$PYTHONUSERBASE/bin:$$PATH"
        PY=/opt/conda/envs/ptca/bin/python
        if [ ! -x "$$PY" ]; then PY=$$(command -v python); fi
        echo "[boot] $$(date) python=$$PY out=$$OUT"
        nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
        unset RANK LOCAL_RANK WORLD_SIZE LOCAL_WORLD_SIZE MASTER_ADDR MASTER_PORT GROUP_RANK || true
        "$$PY" -m pip install --user --no-cache-dir "transformers==4.51.3" accelerate sentencepiece safetensors hf-transfer tiktoken protobuf einops
        "$$PY" -c "import torch,transformers;print('torch',torch.__version__,'tf',transformers.__version__,'gpus',torch.cuda.device_count())"
        ls -la supplement/open_judge_prompts/ || true
        rc=0
        for task in instrument census abstention; do
          echo "[run] qwen3-8b $$task $$(date +%T)"
          "$$PY" scripts/revision3/run_open_weight_judges.py \
            --model "Qwen/Qwen3-8B" \
            --judge-name "qwen3-8b" \
            --task "$$task" \
            --pack "supplement/open_judge_prompts/$$task.jsonl" \
            --output "$$OUT/$$task.jsonl" \
            --summary "$$OUT/$$task-summary.json" \
            --max-model-len 8192 \
            --max-new-tokens 600 \
            --batch-size 16  || { echo "[warn] qwen3-8b $$task failed"; rc=1; }
          ls -la "$$OUT" || true
        done
        echo "[done] qwen3-8b rc=$$rc"
    submit_args:
      env:
        HF_HOME: /scratch/hf_cache
        HUGGINGFACE_HUB_CACHE: /scratch/hf_cache/hub
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTHONUNBUFFERED: "1"
        PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

