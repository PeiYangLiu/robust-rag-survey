description: |
  Controlled crossed-prompt experiment, version 2, on 600 consequence-defined
  robust-RAG deployment decisions (300 counterfactual pairs). Every model
  answers every item under three arms (ablated / length-matched placebo / full)
  crossed with four hand-written paraphrases per arm, i.e. 7,200 greedy
  decisions per model. Ten instruction-tuned open models from five developers
  are covered so that the arm contrast is estimated over a model population
  rather than three fixed checkpoints.

target:
  service: singularity
  name: <SINGULARITY_VC>   # set to your virtual cluster
  workspace_name: <AML_WORKSPACE>   # set to your AzureML workspace

environment:
  image: amlt-sing/acpt-torch2.7.1-py3.10-cuda12.6-ubuntu22.04
  setup:
    - python -m pip install --user "transformers==4.57.1" "accelerate==1.11.0" sentencepiece safetensors hf-transfer

code:
  local_dir: $CONFIG_DIR/../manuscript
  ignore:
    - "*"
    - "!scripts/"
    - "scripts/*"
    - "!scripts/run_controlled_model_judges_v2.py"
    - "!supplement/"
    - "supplement/*"
    - "!supplement/controlled_claim_audit_benchmark_v2.jsonl"

env_defaults:
  HF_HOME: /scratch/hf_cache
  HUGGINGFACE_HUB_CACHE: /scratch/hf_cache/hub
  HF_HUB_ENABLE_HF_TRANSFER: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

jobs:
  - name: qwen25-7b
    identity: managed
    sku: 80G1-A100
    sla_tier: standard
    command:
      - >-
        python scripts/run_controlled_model_judges_v2.py
        --model Qwen/Qwen2.5-7B-Instruct
        --revision a09a35458c702b33eeacc393d103063234e8bc28
        --benchmark supplement/controlled_claim_audit_benchmark_v2.jsonl
        --output "$$AMLT_OUTPUT_DIR/qwen25-7b.jsonl"
        --summary "$$AMLT_OUTPUT_DIR/qwen25-7b-summary.json"
        --batch-size 24 --progress
    submit_args:
      env:
        HF_HOME: /scratch/hf_cache
        HUGGINGFACE_HUB_CACHE: /scratch/hf_cache/hub
        HF_HUB_ENABLE_HF_TRANSFER: "1"
        TOKENIZERS_PARALLELISM: "false"
        PYTHONUNBUFFERED: "1"

  - name: qwen25-14b
